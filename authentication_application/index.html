<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Broker Auth Console</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Broker Auth Console</h1>
      <p class="subtitle">Trigger a broker login flow and complete it right here.</p>
    </header>

    <section id="broker-list" class="broker-list" aria-live="polite">
      <p class="status-line">Loading brokers…</p>
    </section>

    <section id="log-panel" class="log-panel" hidden>
      <h2>Activity</h2>
      <ul id="log-list" class="log-list"></ul>
    </section>
  </main>

  <div id="auth-overlay" class="auth-overlay" hidden>
    <div class="auth-modal">
      <div class="auth-modal-header">
        <h2 id="auth-modal-title">Authenticating…</h2>
        <button id="auth-cancel-btn" class="cancel-btn" type="button">Cancel</button>
      </div>

      <form id="credentials-form" class="auth-form">
        <label for="input-user-id">User ID</label>
        <input id="input-user-id" name="user_id" type="text" autocomplete="off" required />

        <label for="input-password">Password</label>
        <input id="input-password" name="password" type="password" autocomplete="off" required />

        <button type="submit" class="submit-btn">Authenticate</button>
      </form>

      <form id="otp-form" class="auth-form" hidden>
        <label for="input-otp">OTP</label>
        <input id="input-otp" name="otp" type="text" inputmode="numeric" autocomplete="off" required />

        <button type="submit" class="submit-btn">Submit OTP</button>
      </form>

      <p id="auth-modal-status" class="auth-modal-status" hidden></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
