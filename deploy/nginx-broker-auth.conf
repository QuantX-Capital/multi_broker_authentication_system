# Template for the broker-auth site's Nginx server block.
#
# This is not a full nginx.conf - merge these `location` blocks into your
# existing site config (e.g. /etc/nginx/sites-available/auth.quantengine.cloud),
# which already has the server_name / listen 443 ssl / certificate directives
# from your current setup. Do not replace your existing FastAPI proxy block -
# just make sure these three locations exist alongside it.
#
# Requires the auth_request module, which ships in Ubuntu's default `nginx`
# package (no extra install needed).

# --- Internal-only: Nginx calls this itself via auth_request. Never hit
# --- directly by the frontend. Validates the per-session VNC token against
# --- the FastAPI backend before letting a websocket through to noVNC.
location = /auth/vnc/verify {
    internal;
    proxy_pass http://127.0.0.1:8000/auth/vnc/verify?token=$arg_token;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

# --- The noVNC/websockify websocket, gated by the token check above.
# --- Port 6080 itself is never exposed - only reachable via this proxy.
location /vnc/ {
    auth_request /auth/vnc/verify;

    proxy_pass http://127.0.0.1:6080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    # VNC sessions can sit idle for a while during OTP entry - the default
    # 60s proxy timeout would otherwise kill the connection mid-login.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- Static noVNC JS client (already installed via apt at /usr/share/novnc).
# --- Served read-only; no proxying needed.
location /novnc/ {
    alias /usr/share/novnc/;
}

# --- Existing FastAPI proxy - keep whatever you already have here. Shown
# --- for reference only so the file is a complete, mergeable example.
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
