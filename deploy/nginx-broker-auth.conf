# Template for the broker-auth site's Nginx server block.
#
# This is not a full nginx.conf - merge this `location` block into your
# existing site config (e.g. /etc/nginx/sites-available/auth.quantengine.cloud),
# which already has the server_name / listen 443 ssl / certificate directives
# from your current setup (Certbot etc.) - leave those as they are.

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
